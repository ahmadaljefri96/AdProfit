<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" /></noscript>
    <title>Remix AdProfit Dashboard</title>
    <meta name="description" content="Dashboard pintar yang menggabungkan performa Iklan Meta dengan komisi Shopee Affiliate dalam satu tampilan terpadu." />
    <meta property="og:title" content="Remix AdProfit Dashboard" />
    <meta property="og:description" content="Dashboard pintar yang menggabungkan performa Iklan Meta dengan komisi Shopee Affiliate dalam satu tampilan terpadu." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Terapkan tema sebelum halaman tampil (default: gelap)
      try {
        const t = localStorage.getItem('adprofit_theme') || localStorage.getItem('shomet_theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #060914;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      html:not(.dark) #app-splash {
        background: #f8fafc;
        color: #1e293b;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #06b6d4, #6366f1, #d946ef);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px -8px rgba(99, 102, 241, 0.6);
        margin-bottom: 20px;
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #06b6d4, #6366f1, #d946ef);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-sub {
        font-size: 13px;
        opacity: 0.7;
        margin-bottom: 24px;
      }
      .splash-bar-wrap {
        width: 180px;
        height: 4px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #06b6d4, #6366f1);
        border-radius: 9999px;
        animation: splash-bar-anim 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      @keyframes splash-bar-anim {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="splash-logo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="splash-title">AdProfit</div>
        <div class="splash-sub">Memuat dashboard analitik...</div>
        <div class="splash-bar-wrap">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
